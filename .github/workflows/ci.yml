name: CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: override release tag
        required: false
  push:
    branches:
      - main
      - alpha

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: lislon
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  test-and-publish:
    name: Test, Build and Publish
    if: github.repository_owner == 'lislon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
      - name: Setup Tools
        uses: tanstack/config/.github/setup@main
      - name: Ensure npm supports OIDC trusted publishing (>=11.5.1)
        if: github.ref == 'refs/heads/alpha' || github.ref == 'refs/heads/main'
        run: |
          need="11.5.1"
          have="$(npm --version)"
          echo "npm $have (need >= $need for OIDC trusted publishing)"
          lowest="$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)"
          if [ "$lowest" != "$need" ]; then
            echo "npm too old, upgrading..."
            npm install -g npm@latest
            npm --version
          fi
      - name: Generate Prisma files for backend-core
        run: pnpm run prisma:generate
      - name: Run Tests
        run: pnpm run test:ci --parallel=3

      # Alpha releases with @alpha tag (direct publish, no PR)
      - name: Create snapshot changeset if none exists (alpha)
        if: github.ref == 'refs/heads/alpha'
        run: |
          if [ ! "$(ls -A .changeset/*.md 2>/dev/null | grep -v README)" ]; then
            echo "No changeset found, creating one..."
            cat > .changeset/snapshot-release.md << 'EOF'
          ---
          "@igstack/app-catalog-backend-core": patch
          "@igstack/app-catalog-frontend-core": patch
          "@igstack/app-catalog-shared-core": patch
          "@igstack/app-catalog-table-sync": patch
          "@igstack/app-catalog-frontend-build-vite": patch
          ---

          Snapshot release from alpha branch
          EOF
          fi
      - name: Version packages (alpha snapshot)
        if: github.ref == 'refs/heads/alpha'
        run: pnpm changeset version --snapshot alpha
        env:
          # Required by @changesets/changelog-github to resolve PR/commit links
          # when a real changeset file is present (snapshot-only changesets skip this).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update lockfile (alpha)
        if: github.ref == 'refs/heads/alpha'
        run: pnpm install --no-frozen-lockfile
      - name: Build packages (alpha)
        if: github.ref == 'refs/heads/alpha'
        run: pnpm run build:all
      - name: Bake git SHA into package.json (alpha)
        if: github.ref == 'refs/heads/alpha'
        run: node scripts/write-git-sha.mjs "${{ github.sha }}"
      - name: Publish to @alpha tag
        if: github.ref == 'refs/heads/alpha'
        # Publish via the npm CLI so npm's OIDC trusted-publishing is used
        # (no NPM_TOKEN). pnpm packs each package (rewriting workspace:* to
        # concrete versions); npm publishes the tarballs with provenance.
        run: node scripts/publish-oidc.mjs --tag alpha

      # Nothing is committed back to this branch. The snapshot version bump, the
      # refreshed lockfile and the consumed changeset all live only in the
      # runner's working tree, on purpose. A former step here staged and pushed
      # them, which caused two separate failures:
      #   * it froze the version base — once `X-alpha-<timestamp>` is committed, a
      #     `patch` of it resolves back to `X`, so every later snapshot shared one
      #     base forever and the pre-release tag sat semver-BELOW `latest`, which
      #     no dependency range can promote.
      #   * it committed the changeset deletion, so the stable branch never saw
      #     the changeset and every stable release needed a manual cherry-pick.
      # `packages/*/package.json` must therefore stay at the version the stable
      # branch declares.

      # Stable releases for main branch
      - name: Run Changesets (main)
        if: github.ref == 'refs/heads/main'
        uses: changesets/action@v1.5.3
        with:
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

