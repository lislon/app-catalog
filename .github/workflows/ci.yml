name: CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: override release tag
        required: false
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: lislon
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  test-and-publish:
    name: Test, Build and Publish
    if: github.repository_owner == 'lislon'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
      - name: Setup Tools
        uses: tanstack/config/.github/setup@main
      - name: Ensure npm supports OIDC trusted publishing (>=11.5.1)
        if: github.ref == 'refs/heads/main'
        run: |
          need="11.5.1"
          have="$(npm --version)"
          echo "npm $have (need >= $need for OIDC trusted publishing)"
          lowest="$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)"
          if [ "$lowest" != "$need" ]; then
            echo "npm too old, upgrading..."
            npm install -g npm@latest
            npm --version
          fi
      - name: Generate Prisma files for backend-core
        run: pnpm run prisma:generate
      - name: Run Tests
        run: pnpm run test:ci --parallel=3

      # Releases: one branch, one channel, one merge.
      - name: Check declared versions against the registry (main)
        if: github.ref == 'refs/heads/main'
        run: node scripts/check-registry-versions.mjs
      - name: Capture npm dist-tags before release (main)
        if: github.ref == 'refs/heads/main'
        run: node scripts/dist-tag-guard.mjs capture --tag latest --out "$RUNNER_TEMP/dist-tags-before.json"
      - name: Version, publish and record (main)
        id: release
        if: github.ref == 'refs/heads/main'
        # Publishes @latest and commits the version bump back, so merging a PR
        # with a changeset is the whole release. A push with no changeset is a
        # no-op. See scripts/release-main.sh for why it publishes before it
        # records.
        run: bash scripts/release-main.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert the @latest tag moved (main)
        if: github.ref == 'refs/heads/main'
        # Only asserts for packages that declared an unpublished version *before*
        # the release ran, so a push carrying no changeset stays green.
        run: node scripts/dist-tag-guard.mjs assert --before "$RUNNER_TEMP/dist-tags-before.json"
        env:
          CHANGESETS_PUBLISHED: ${{ steps.release.outputs.published }}

