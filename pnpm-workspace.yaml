packages:
  - packages/*
  - examples/*

catalog:
  # Capped below 1.7.0: that release dropped the `genericOAuthClient` export from
  # `better-auth/client/plugins`, which `modules/auth/authClient.ts` imports. A caret
  # range leaks into the published packages, so a consumer installing without a
  # lockfile resolves 1.7.0 and its bundler fails on the missing export. Raise the cap
  # once authClient migrates to the 1.7 entry point.
  better-auth: '>=1.4.18 <1.7.0'
